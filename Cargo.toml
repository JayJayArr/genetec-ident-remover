[package]
name = "genetec-ident-remover"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/JayJayArr/genetec-ident-remover"

[dependencies]
anyhow = "1.0.104"
clap = {version = "4.6.6", features = ["derive"]}
reqwest = {version= "0.13.5"}
serde = {version ="1.0.229", features = ["derive"]}
serde_json = "1.0.151"
tokio = {version ="1.53.1", features = ["full"]}
tracing = "0.1.44"
oauth2 = {version = "5.0.0"}
tracing-subscriber = {version ="0.3.23", features = ["env-filter", "std"]}
chrono = {version = "0.4.45", features= ["serde", "clock"]}
futures-util = "0.3.34"
wiremock = "0.6.5"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
